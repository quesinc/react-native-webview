name: 'Lint'
on: [pull_request]

jobs:
  lint:
    name: 'Running lint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'
          cache: 'yarn'
      - name: Setup - Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run lint
        run: yarn lint:ci
